# LoRA training config for Stable Diffusion 1.5 (kohya sd-scripts)
# Edit values in the Colab notebook — this file is a reference template.

[model_arguments]
pretrained_model_name_or_path = "/content/drive/MyDrive/FiratSuper/models/stable-diffusion-v1-5"
v2 = false
v_parameterization = false

[dataset_arguments]
train_data_dir = "/content/drive/MyDrive/FiratSuper/datasets/PROJECT_NAME"
reg_data_dir = ""
resolution = "512,512"
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 1024
bucket_reso_steps = 64
bucket_no_upscale = false
caption_extension = ".txt"
shuffle_caption = true
keep_tokens = 1

[training_arguments]
output_dir = "/content/drive/MyDrive/FiratSuper/output/PROJECT_NAME"
output_name = "PROJECT_NAME_lora"
save_model_as = "safetensors"
save_precision = "fp16"
save_every_n_epochs = 1
max_train_epochs = 10
train_batch_size = 1
gradient_checkpointing = true
gradient_accumulation_steps = 1
learning_rate = 1e-4
lr_scheduler = "cosine"
lr_warmup_steps = 0
optimizer_type = "AdamW8bit"
mixed_precision = "fp16"
seed = 42
max_data_loader_n_workers = 2
persistent_data_loader_workers = true
max_token_length = 75
xformers = true
cache_latents = true
cache_latents_to_disk = true

[network_arguments]
network_module = "networks.lora"
network_dim = 32
network_alpha = 16
network_train_unet_only = true
network_train_text_encoder = false

[sample_prompt_arguments]
sample_every_n_epochs = 0

[logging_arguments]
log_with = "tensorboard"
logging_dir = "/content/drive/MyDrive/FiratSuper/logs/PROJECT_NAME"
